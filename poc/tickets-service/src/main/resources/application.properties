# Application
spring.application.name=tickets-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://tickets-postgres-service:5432/ticketsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=ticketsuser
spring.datasource.password=ticketspassword

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Initialize data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# SNS Configuration (to be configured with actual topic ARN)
app.sns.enabled=false
app.sns.topic-arn=arn:aws:sns:us-east-1:123456789012:ticket-events
app.sns.region=us-east-1
app.sns.queue-name=ticket-events-queue